<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Lingua — английский</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--surface:#F7F8FA;--ink:#172033;--muted:#667085;--line:#E5E7EB;--p:#2563EB;--ok:#16A870;--bad:#E5484D;--flame:#F59E0B;
--p-soft:color-mix(in srgb,var(--p) 11%,var(--bg));--ok-soft:color-mix(in srgb,var(--ok) 13%,var(--bg));--bad-soft:color-mix(in srgb,var(--bad) 11%,var(--bg));
--sh:0 5px 18px rgba(15,27,45,.05);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none;transition:background .35s,color .35s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;height:100dvh;margin:0 auto;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;animation:vin .38s var(--ease)}
.view.noanim,.noanim{animation:none}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom));scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
b{font-weight:700}small{color:var(--muted);font-size:13px}
/* tabs */
.tabs{position:absolute;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px;border-radius:28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:var(--sh);z-index:20}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border-radius:22px;color:var(--muted);font-weight:600;font-size:15px;transition:all .3s var(--ease)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--p-soft);color:var(--p)}
/* common */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;background:var(--p);color:#fff;font-weight:700;font-size:16px;box-shadow:0 2px 0 color-mix(in srgb,var(--p) 70%,#000);transition:transform .12s,box-shadow .12s,opacity .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--p) 70%,#000)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.soft{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.soft:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{height:44px;font-size:14px;border-radius:14px;width:auto;padding:0 18px}
.link{display:block;margin:14px auto 0;color:var(--p);font-weight:600;font-size:14px}
.inp{width:100%;height:54px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 18px;font-size:16px;outline:0;transition:border-color .2s,background .2s;margin-bottom:10px}
.inp:focus{border-color:var(--p);background:var(--bg)}
.err{min-height:20px;color:var(--bad);font-size:14px;font-weight:500;text-align:center;margin-bottom:8px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:99px;background:var(--surface);font-weight:700;font-size:14px}
.av{--s:48px;width:var(--s);height:var(--s);border-radius:50%;position:relative;overflow:hidden;flex:none;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 50%,#fff));display:grid;place-items:center;color:#fff;font-weight:800;font-size:calc(var(--s)*.42)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* auth */
.auth{justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 26px calc(24px + env(safe-area-inset-bottom));overflow-y:auto}
.auth-in{text-align:center;margin:auto 0;width:100%}
.auth .av{margin:0 auto 16px;box-shadow:0 0 0 6px var(--p-soft)}
.auth h1{margin:6px 0 2px;font-size:28px;font-weight:800;letter-spacing:-.02em}
.auth .un{margin:0 0 18px;color:var(--muted);font-weight:600}
.auth .lead{color:var(--muted);font-size:15px;line-height:1.45;margin:0 0 16px}
.brand{font-weight:800;font-size:15px;color:var(--p);margin-bottom:26px;letter-spacing:.01em}
.opt-card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;transition:all .2s}
.opt-card.on{border-color:var(--p);background:var(--p-soft)}
.opt-card .t{font-weight:800;font-size:20px;width:44px;color:var(--p)}
.opt-card small{display:block}
/* home */
.hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hd-t{flex:1;min-width:0;display:flex;flex-direction:column}
.hd-t b{font-size:18px}
.goal{display:flex;gap:18px;align-items:center;padding:18px;border-radius:16px;background:var(--surface);margin-bottom:14px}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .tr{stroke:var(--line)}.ring .pr{stroke:var(--p);transition:stroke-dashoffset 1s var(--ease)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.goal h3{margin:0 0 4px;font-size:20px;font-weight:800}
.cont{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--p);color:#fff;margin-bottom:14px;width:100%;text-align:left;box-shadow:0 5px 0 color-mix(in srgb,var(--p) 68%,#000);transition:transform .12s,box-shadow .12s}
.cont:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--p) 68%,#000)}
.cont .e{width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:28px;flex:none}
.cont b{display:block;font-size:18px}.cont small{color:rgba(255,255,255,.8)}
.cont .go{margin-left:auto;font-weight:800;background:#fff;color:var(--p);border-radius:14px;padding:10px 14px;font-size:14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.fc{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);transition:transform .15s,border-color .2s;min-height:128px}
.fc:active{transform:scale(.97)}
.fc .ic{font-size:30px}.fc b{font-size:16px}.fc small{line-height:1.3}
.fc.ai{background:var(--p-soft);border-color:transparent}
.fc.off{opacity:.55}
.sec{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.sec h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:15px}
.seg button{flex:1;padding:9px 12px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);transition:all .25s var(--ease)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 2px 8px rgba(15,27,45,.1)}
.unit.locked{opacity:.62}.unit.locked .unit-h{cursor:default}.unit{border:1px solid var(--line);border-radius:22px;margin-bottom:10px;overflow:hidden;transition:border-color .3s}
.unit.open{border-color:color-mix(in srgb,var(--p) 35%,var(--line))}
.unit-h{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left}
.u-ico{width:48px;height:48px;border-radius:16px;background:var(--surface);display:grid;place-items:center;font-size:26px;flex:none}
.u-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.u-t b{font-size:17px}
.lv{display:inline-block;font-size:11px;font-weight:800;color:var(--p);background:var(--p-soft);border-radius:7px;padding:2px 6px;margin-right:6px}
.u-prog{font-weight:700;font-size:14px;color:var(--muted)}
.chev{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;transition:transform .35s var(--ease)}
.unit.open .chev{transform:rotate(180deg)}
.unit-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.unit.open .unit-b{grid-template-rows:1fr}
.unit-b>div{overflow:hidden}
.path{padding:4px 16px 18px}
.node{display:flex;align-items:center;gap:14px;padding:8px 0;width:100%;text-align:left}
.nc{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-style:normal;background:var(--surface);border:3px solid var(--line);flex:none;transition:transform .15s}
.node:active .nc{transform:scale(.92)}
.node.done .nc{background:var(--p);border-color:var(--p);color:#fff;font-weight:800}
.node.next .nc{border-color:var(--p);background:var(--p-soft);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--p) 40%,transparent)}70%,100%{box-shadow:0 0 0 14px transparent}}
.node b{display:block;font-size:16px}.node small{display:block}
.stars{color:var(--flame);letter-spacing:2px;font-size:14px}
/* profile */
.pf{text-align:center;padding:6px 0 18px}
.pf .av{margin:0 auto 12px;box-shadow:0 0 0 6px var(--p-soft)}
.pf h1{margin:0;font-size:26px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat{padding:14px 16px;border-radius:20px;background:var(--surface)}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;padding:16px;border-radius:22px;background:var(--surface);margin-bottom:22px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wd i{display:block;width:100%;border-radius:8px;background:var(--line);min-height:6px;transition:height .8s var(--ease)}
.wd.today i{background:var(--p)}.wd small{font-size:12px}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.a{padding:12px 6px;border-radius:18px;background:var(--surface);text-align:center;font-size:12px;font-weight:600;line-height:1.25}
.a i{display:block;font-style:normal;font-size:28px;margin-bottom:4px}
.a.lock{opacity:.4;filter:grayscale(1)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row>span{font-weight:600}
.row .seg{flex:none}.row .seg button{padding:7px 10px;font-size:13px}
.sw{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .3s var(--ease)}
.sw.on{background:var(--p)}.sw.on::after{transform:translateX(22px)}
.dots{display:flex;gap:10px}
.dot{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 2px transparent;transition:box-shadow .2s}
.dot.on{box-shadow:0 0 0 2px var(--c)}
.card{padding:4px 18px;border-radius:22px;background:var(--surface);margin-bottom:16px}
.card h4{margin:14px 0 0;font-size:13px;color:var(--muted);font-weight:700}
.danger{color:var(--bad)!important}
/* lesson */
.les-top{display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.x{width:38px;height:38px;border-radius:50%;background:var(--surface);font-size:16px;color:var(--muted);flex:none}
.bar{flex:1;height:14px;border-radius:99px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--p);transition:width .6s var(--ease)}
.les-body{flex:1;overflow-y:auto;padding:14px 20px;scrollbar-width:none}
.ex{animation:exin .35s var(--ease)}
@keyframes exin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.q{font-size:22px;font-weight:800;margin:10px 0 18px;letter-spacing:-.01em}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0 0 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;line-height:1.2}
.big.sm{font-size:24px}
.spk{width:44px;height:44px;border-radius:50%;background:var(--p-soft);display:inline-grid;place-items:center;font-size:19px;flex:none;transition:transform .15s}
.spk:active{transform:scale(.9)}
.bigspk{width:96px;height:96px;border-radius:30px;background:var(--p);font-size:38px;margin:10px 0 24px;box-shadow:0 5px 0 color-mix(in srgb,var(--p) 68%,#000);display:grid;place-items:center}
.bigspk:active{transform:translateY(4px);box-shadow:none}
.opts{display:grid;gap:10px}
.opt{padding:16px 18px;border:1px solid var(--line);border-radius:17px;text-align:left;font-weight:600;font-size:17px;box-shadow:0 3px 0 var(--line);transition:all .15s}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--p);background:var(--p-soft);box-shadow:0 3px 0 var(--p)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.ln{width:100%;height:60px;border:1px solid var(--line);background:var(--surface);border-radius:17px;padding:0 18px;font-size:20px;font-weight:600;outline:0}
.ln:focus{border-color:var(--p);background:var(--bg)}
.slots{min-height:62px;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);margin-bottom:20px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{padding:11px 16px;border:1px solid var(--line);border-radius:14px;font-weight:600;font-size:17px;box-shadow:0 3px 0 var(--line);background:var(--bg);animation:pop .25s var(--ease)}
.tok.gone{visibility:hidden}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:none;opacity:1}}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .mb{padding:15px 10px;border:1px solid var(--line);border-radius:16px;font-weight:600;font-size:16px;box-shadow:0 3px 0 var(--line);margin-bottom:0;transition:all .2s;text-align:center;min-height:60px}
.mb.sel{border-color:var(--p);background:var(--p-soft)}
.mb.done{border-color:var(--ok);background:var(--ok-soft);opacity:.5;pointer-events:none}
.mic{width:96px;height:96px;border-radius:50%;background:var(--p);color:#fff;font-size:36px;margin:8px auto 14px;display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--p) 68%,#000)}
.mic.rec{animation:pulse 1.2s infinite;background:var(--bad);box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.note{font-size:17px;line-height:1.55;padding:18px;border-radius:20px;background:var(--p-soft);margin-bottom:16px}
.ic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:var(--surface);margin-bottom:8px}
.ic b{display:block;font-size:17px}.ic .spk{width:38px;height:38px;font-size:16px;background:var(--bg)}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));transition:background .3s}
.foot.ok{background:var(--ok-soft)}.foot.no{background:var(--bad-soft)}
.fbm{display:flex;flex-direction:column;gap:2px;margin-bottom:12px;animation:vin .3s var(--ease)}
.fbm b{font-size:20px}.foot.ok b{color:var(--ok)}.foot.no b{color:var(--bad)}
.foot.ok .btn{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 68%,#000)}
.foot.no .btn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 68%,#000)}
.sk{display:block;margin:12px auto 0;color:var(--muted);font-weight:600;font-size:14px}
/* done */
.done{align-items:center;justify-content:center;text-align:center;padding:30px}
.done h1{font-size:30px;margin:10px 0 6px;font-weight:800}
.bst{font-size:56px;letter-spacing:6px;color:var(--flame);animation:pop .6s var(--ease)}
.res{display:flex;gap:10px;margin:22px 0;width:100%}
.res div{flex:1;padding:14px 6px;border-radius:18px;background:var(--surface)}
.res b{display:block;font-size:24px}
.cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
/* chat */
.ch-top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none;transition:background .2s}
.ib.on{background:var(--p-soft)}
.ch-t{flex:1;display:flex;flex-direction:column}.ch-t b{font-size:17px}
.ch-t small{display:flex;align-items:center;gap:6px}.ch-t small::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:14px!important;padding-top:14px!important}
.m{display:flex;align-items:flex-end;gap:6px;max-width:86%;animation:mi .3s var(--ease)}
@keyframes mi{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.m.ai{align-self:flex-start}.m.me{align-self:flex-end;flex-direction:column;align-items:flex-end}
.m .b{padding:11px 15px;border-radius:20px;font-size:16px;line-height:1.4}
.m.ai .b{background:var(--surface);border-bottom-left-radius:6px}
.m.me .b{background:var(--p);color:#fff;border-bottom-right-radius:6px}
.m .w{border-radius:5px;transition:background .15s}.m .w:active{background:var(--p-soft)}
.m .spk{width:32px;height:32px;font-size:14px;background:none;opacity:.6}
.fix{font-size:13px;line-height:1.4;padding:8px 12px;border-radius:14px;background:var(--ok-soft);color:var(--ink);max-width:100%}
.fix b{color:var(--ok)}.fix span{display:block;color:var(--muted);margin-top:2px}
.sysn{align-self:center;text-align:center;font-size:13px;color:var(--muted);padding:6px 14px;background:var(--surface);border-radius:99px;max-width:90%}
.typ .b{display:flex;gap:4px;padding:15px 16px}
.typ i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1.1s infinite}
.typ i:nth-child(2){animation-delay:.18s}.typ i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.endc{align-self:stretch;text-align:center;padding:18px;border-radius:22px;background:var(--p-soft);animation:mi .4s var(--ease)}
.endc b{display:block;font-size:18px;margin-bottom:10px}
.hints{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none;flex:none}
.hints:not(:empty){padding-bottom:10px}
.hint{flex:none;text-align:left;padding:8px 14px;border-radius:16px;border:1px solid var(--line);animation:mi .3s var(--ease)}
.hint b{display:block;font-size:14px;font-weight:600}.hint small{font-size:12px}
.cin-bar{display:flex;gap:8px;align-items:center;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.cin{flex:1;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--surface);padding:0 18px;font-size:16px;outline:0;min-width:0}
.cin:focus{border-color:var(--p);background:var(--bg)}
.send{width:48px;height:48px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s}
.send:active{transform:scale(.9)}.send svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.sc{padding:14px;border:1px solid var(--line);border-radius:18px;text-align:left;transition:all .2s}
.sc.on{border-color:var(--p);background:var(--p-soft)}.sc i{font-style:normal;font-size:26px;display:block;margin-bottom:4px}
.sc b{display:block;font-size:15px}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fi .25s}
@keyframes fi{from{opacity:0}}
.md{width:100%;max-width:560px;background:var(--bg);border-radius:28px 28px 0 0;padding:24px 22px calc(22px + env(safe-area-inset-bottom));animation:su .4s var(--ease)}
@keyframes su{from{transform:translateY(100%)}}
.md h3{margin:0 0 8px;font-size:22px;font-weight:800}.md p{margin:0 0 18px;color:var(--muted);line-height:1.5}
.md textarea{width:100%;height:110px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:12px;font-size:13px;resize:none;margin-bottom:12px;outline:0;word-break:break-all}
.md .two{display:flex;gap:10px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:600;font-size:14px;z-index:90;opacity:0;transition:all .4s var(--ease);max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;z-index:80;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;animation:mi .2s;max-width:260px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:3px solid color-mix(in srgb,var(--p) 50%,transparent);outline-offset:2px}
.tg-safe{height:calc(8px + env(safe-area-inset-top));flex:none}.eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--p);margin-bottom:8px}.place-bar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;margin:10px 0 20px}.place-bar i{display:block;height:100%;background:var(--p);border-radius:99px;transition:width .3s}.place-card{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.level-result{display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;background:var(--surface);margin:18px 0}.level-result b{font-size:30px;color:var(--p)}.level-result span{font-size:14px;line-height:1.45;color:var(--muted)}.setting-fixed,.level-lock{font-size:13px;color:var(--muted);font-weight:600}.goal-seg{margin-bottom:18px}</style>

const RAW=[
["A1","👋","Привет!","Приветствия и знакомство",

"Hello, my name is Anna.|Привет, меня зовут Анна.;Nice to meet you.|Приятно познакомиться.;How are you?|Как дела?;I am fine, thank you.|У меня всё хорошо, спасибо.;Good morning, my friend.|Доброе утро, мой друг.;Where are you from?|Откуда ты?;I am from Russia.|Я из России.;See you tomorrow.|Увидимся завтра.",
["Глагол to be","Глагол <b>to be</b> («быть») в настоящем времени: <b>I am</b>, <b>you are</b>, <b>he / she / it is</b>, <b>we / they are</b>. В английском предложении всегда нужен глагол: «Я студент» = I <b>am</b> a student.","I am Anna.|Я Анна.;You are my friend.|Ты мой друг.;She is happy.|Она счастлива."]],
["A1","🔢","Числа","Числа, возраст, количество",
"one|один;two|два;three|три;four|четыре;five|пять;six|шесть;seven|семь;eight|восемь;nine|девять;ten|десять;hundred|сто;zero|ноль",
"I have two brothers.|У меня два брата.;She is nine years old.|Ей девять лет.;It is five o'clock.|Сейчас пять часов.;How old are you?|Сколько тебе лет?;I am ten years old.|Мне десять лет.;We have six apples.|У нас шесть яблок.;There are seven days in a week.|В неделе семь дней.;He has three cats.|У него три кошки.",
["Возраст и have","Возраст выражают через <b>to be</b>: <b>I am ten</b> (а не «I have ten»). Для «иметь» используют <b>have</b>: I / you / we / they <b>have</b>, he / she / it <b>has</b>.","I am twenty years old.|Мне двадцать лет.;She has two sisters.|У неё две сестры.;They have five books.|У них пять книг."]],
["A1","👨‍👩‍👧","Семья","Родные и близкие",
"mother|мама;father|папа;brother|брат;sister|сестра;son|сын;daughter|дочь;grandmother|бабушка;grandfather|дедушка;parents|родители;family|семья;husband|муж;wife|жена",
"This is my family.|Это моя семья.;My mother is a doctor.|Моя мама — врач.;I love my parents.|Я люблю своих родителей.;Do you have a sister?|У тебя есть сестра?;My brother is tall.|Мой брат высокий.;Her husband is very kind.|Её муж очень добрый.;His grandmother lives in Kazan.|Его бабушка живёт в Казани.;Our family is big.|Наша семья большая.",
["Притяжательные местоимения","<b>my</b> (мой), <b>your</b> (твой / ваш), <b>his</b> (его), <b>her</b> (её), <b>our</b> (наш), <b>their</b> (их). Они стоят перед существительным и не меняются: my brother, my sisters.","This is my mother.|Это моя мама.;Her son is small.|Её сын маленький.;Their house is big.|Их дом большой."]],
["A1","🍎","Еда и напитки","Что мы едим и пьём",
"bread|хлеб;water|вода;milk|молоко;coffee|кофе;tea|чай;apple|яблоко;meat|мясо;fish|рыба;cheese|сыр;egg|яйцо;rice|рис;soup|суп",
"I drink coffee every morning.|Я пью кофе каждое утро.;She likes tea with milk.|Она любит чай с молоком.;We eat soup for lunch.|Мы едим суп на обед.;Do you like fish?|Ты любишь рыбу?;I don't like cheese.|Я не люблю сыр.;He eats an apple.|Он ест яблоко.;I want a glass of water.|Я хочу стакан воды.;They have bread and eggs.|У них есть хлеб и яйца.",
["Артикли a / an","<b>a</b> ставится перед согласным звуком (a book), <b>an</b> — перед гласным (an apple, an egg). Артикль нужен перед исчисляемым существительным в единственном числе.","I eat an egg.|Я ем яйцо.;She has a cat.|У неё есть кошка.;It is an orange.|Это апельсин."]],
["A1","🎨","Цвета и вещи","Описываем предметы",
"red|красный;blue|синий;green|зелёный;yellow|жёлтый;black|чёрный;white|белый;table|стол;chair|стул;book|книга;phone|телефон;bag|сумка;key|ключ",
"The sky is blue.|Небо синее.;I have a red bag.|У меня красная сумка.;Where is my phone?|Где мой телефон?;The book is on the table.|Книга лежит на столе.;This is a black chair.|Это чёрный стул.;That is my key.|Это мой ключ.;These are white cups.|Это белые чашки.;Those books are yellow.|Те книги жёлтые.",
["This / That / These / Those","<b>this</b> — этот (близко), <b>that</b> — тот (далеко). Во множественном числе: <b>these</b> и <b>those</b>. This is a key. These are keys.","This is my bag.|Это моя сумка.;That is a green door.|То — зелёная дверь.;These are my books.|Это мои книги."]],
["A1","🏠","Дом","Комнаты и мебель",
"house|дом;room|комната;kitchen|кухня;bedroom|спальня;bathroom|ванная;door|дверь;window|окно;bed|кровать;floor|пол;garden|сад;roof|крыша;wall|стена",
"I live in a big house.|Я живу в большом доме.;The kitchen is clean.|Кухня чистая.;My bedroom is small.|Моя спальня маленькая.;There is a bed in the room.|В комнате есть кровать.;There are two windows.|Там два окна.;There is a garden behind the house.|За домом есть сад.;There isn't a table here.|Здесь нет стола.;Are there any chairs?|Есть ли там стулья?",
["There is / There are","<b>There is</b> + единственное число (There is a bed), <b>There are</b> + множественное (There are two chairs). Отрицание: there isn't / there aren't. Вопрос: Is there…? Are there…?","There is a cat on the roof.|На крыше есть кошка.;There are three rooms.|Там три комнаты.;Is there a bank here?|Здесь есть банк?"]],
["A1","⏰","Распорядок дня","Привычки и режим",
"wake up|просыпаться;breakfast|завтрак;lunch|обед;dinner|ужин;work|работа;sleep|спать;morning|утро;afternoon|день;evening|вечер;night|ночь;every day|каждый день;always|всегда",
"I wake up at seven.|Я просыпаюсь в семь.;We have lunch at one.|Мы обедаем в час.;She works every day.|Она работает каждый день.;They always eat breakfast.|Они всегда завтракают.;I don't sleep in the afternoon.|Я не сплю днём.;Do you work in the evening?|Ты работаешь вечером?;I go to bed at eleven.|Я ложусь спать в одиннадцать.;We often have dinner together.|Мы часто ужинаем вместе.",
["Present Simple: I, you, we, they","Для привычек и повторяющихся действий: <b>I work</b>, <b>they sleep</b>. Отрицание: <b>don't</b> + глагол (I don't work). Вопрос: <b>Do</b> you work? Слова-подсказки: always, often, every day.","I eat breakfast at eight.|Я завтракаю в восемь.;We don't work at night.|Мы не работаем ночью.;Do they sleep late?|Они поздно спят?"]],
["A1","🐶","Животные","Домашние и дикие",
"dog|собака;cat|кошка;bird|птица;horse|лошадь;cow|корова;rabbit|кролик;mouse|мышь;lion|лев;bear|медведь;monkey|обезьяна;pig|свинья;tiger|тигр",
"I have a dog.|У меня есть собака.;The cat is sleeping.|Кошка спит.;Birds can fly.|Птицы умеют летать.;A lion is a big cat.|Лев — это большая кошка.;Two mice are in the box.|Две мыши в коробке.;I see three horses.|Я вижу трёх лошадей.;Monkeys like bananas.|Обезьяны любят бананы.;The boxes are red.|Коробки красные.",
["Множественное число","Обычно добавляем <b>-s</b>: dog → dogs. После s, sh, ch, x — <b>-es</b>: box → boxes. Исключения: mouse → <b>mice</b>, child → <b>children</b>, man → <b>men</b>, woman → <b>women</b>.","I have two dogs.|У меня две собаки.;The boxes are red.|Коробки красные.;Three children are here.|Здесь трое детей."]],
["A1","👕","Одежда","Что мы носим",
"shirt|рубашка;shoes|обувь;dress|платье;jacket|куртка;hat|шапка;socks|носки;jeans|джинсы;coat|пальто;skirt|юбка;scarf|шарф;gloves|перчатки;boots|сапоги",
"I wear jeans every day.|Я ношу джинсы каждый день.;She has a new dress.|У неё новое платье.;Put on your jacket.|Надень куртку.;It is cold, take a coat.|Холодно, возьми пальто.;I am wearing a blue shirt.|На мне синяя рубашка.;She is wearing black boots.|На ней чёрные сапоги.;They are buying new shoes.|Они покупают новую обувь.;He isn't wearing a hat.|На нём нет шапки.",
["Present Continuous","Действие <b>прямо сейчас</b>: <b>am / is / are</b> + глагол с <b>-ing</b>. I am reading. She is sleeping. They are playing. Слова-подсказки: now, at the moment.","I am wearing a hat.|На мне шапка.;She is reading a book.|Она читает книгу.;We are eating soup now.|Мы сейчас едим суп."]],
["A1","🏙️","Город","Места и ориентиры",
"street|улица;shop|магазин;bank|банк;park|парк;school|школа;hospital|больница;station|вокзал;bus|автобус;car|машина;bridge|мост;restaurant|ресторан;map|карта",
"Where is the station?|Где вокзал?;I live on Green Street.|Я живу на Зелёной улице.;The bank is next to the shop.|Банк рядом с магазином.;The park is behind the school.|Парк за школой.;The restaurant is in the city centre.|Ресторан в центре города.;I am at the hospital.|Я в больнице.;The bus stop is near the bridge.|Автобусная остановка около моста.;My car is in front of the bank.|Моя машина перед банком.",
["Предлоги места","<b>in</b> — внутри (in the park), <b>on</b> — на поверхности (on the table), <b>at</b> — в точке (at school), <b>next to</b> — рядом, <b>behind</b> — за, <b>in front of</b> — перед, <b>near</b> — около.","The map is on the table.|Карта лежит на столе.;He is at work.|Он на работе.;The cat is behind the door.|Кошка за дверью."]],
["A2","🎸","Хобби","Свободное время",
"hobby|хобби;music|музыка;movie|фильм;game|игра;read|читать;draw|рисовать;swim|плавать;dance|танцевать;sing|петь;travel|путешествовать;photo|фото;sport|спорт",
"My hobby is photography.|Моё хобби — фотография.;I love listening to music.|Я люблю слушать музыку.;She enjoys swimming in the sea.|Ей нравится плавать в море.;He likes playing games.|Ему нравится играть в игры.;My sister draws very well.|Моя сестра очень хорошо рисует.;Does he like dancing?|Ему нравится танцевать?;We don't watch many movies.|Мы не смотрим много фильмов.;I'd like to learn to sing.|Я бы хотел научиться петь.",
["like / love + -ing","После <b>like, love, enjoy, hate</b> глагол обычно получает <b>-ing</b>: I like reading. She enjoys dancing. С he / she / it в Present Simple добавляем <b>-s</b>: she draws, he swims.","I enjoy travelling.|Мне нравится путешествовать.;He loves singing.|Он любит петь.;She doesn't like swimming.|Она не любит плавать."]],
["A2","✈️","Путешествия","Билеты, отели, аэропорты",
"ticket|билет;passport|паспорт;airport|аэропорт;luggage|багаж;hotel|отель;flight|рейс;train|поезд;trip|поездка;tourist|турист;journey|путь;reservation|бронь;visa|виза",
"I need a ticket to Paris.|Мне нужен билет в Париж.;Where is my luggage?|Где мой багаж?;We stayed in a small hotel.|Мы останавливались в маленьком отеле.;The flight was late.|Рейс задержался.;I was at the airport yesterday.|Вчера я был в аэропорту.;They were very tired after the trip.|Они очень устали после поездки.;We visited Rome last summer.|Прошлым летом мы посетили Рим.;She booked a room online.|Она забронировала номер онлайн.",
["Past Simple: правильные глаголы","Прошедшее время: к глаголу добавляем <b>-ed</b>: visit → visited, book → booked. <b>To be</b> в прошлом: <b>was</b> (I, he, she, it) и <b>were</b> (you, we, they). Слова-подсказки: yesterday, last week, in 2020.","I visited my friend.|Я навестил друга.;He was at home.|Он был дома.;We were in Rome.|Мы были в Риме."]],
["A2","💊","Здоровье","У врача и в аптеке",
"head|голова;stomach|живот;doctor|врач;medicine|лекарство;pain|боль;cold|простуда;fever|температура;healthy|здоровый;tired|уставший;sick|больной;headache|головная боль;pharmacy|аптека",
"I have a headache.|У меня болит голова.;You should see a doctor.|Тебе стоит сходить к врачу.;She has a fever.|У неё температура.;He feels sick today.|Сегодня ему плохо.;You shouldn't eat so much sugar.|Тебе не стоит есть так много сахара.;I think you should rest.|Думаю, тебе нужно отдохнуть.;Where is the nearest pharmacy?|Где ближайшая аптека?;I have a pain in my stomach.|У меня боль в животе.",
["should / shouldn't","<b>should</b> — совет («стоит», «следует»). После него глагол без to и без -s: You <b>should</b> sleep. He <b>should</b> rest. Отрицание — <b>shouldn't</b>. Вопрос: Should I call a doctor?","You should drink water.|Тебе стоит пить воду.;He shouldn't work today.|Ему не стоит работать сегодня.;Should I take medicine?|Мне принять лекарство?"]],
["A2","💼","Работа и учёба","Офис, учёба, карьера",
"job|работа;office|офис;boss|начальник;meeting|встреча;salary|зарплата;colleague|коллега;teacher|учитель;student|студент;exam|экзамен;lesson|урок;homework|домашнее задание;career|карьера",
"I work in a big office.|Я работаю в большом офисе.;My boss was angry yesterday.|Вчера мой начальник злился.;We had a meeting at ten.|У нас была встреча в десять.;She went to university in 2018.|Она пошла в университет в 2018 году.;He didn't pass the exam.|Он не сдал экзамен.;Did you do your homework?|Ты сделал домашнее задание?;I wrote an email to my colleague.|Я написал письмо коллеге.;They bought a new computer.|Они купили новый компьютер.",
["Неправильные глаголы","У частых глаголов прошедшая форма особая: go → <b>went</b>, have → <b>had</b>, do → <b>did</b>, buy → <b>bought</b>, write → <b>wrote</b>, see → <b>saw</b>. В отрицаниях и вопросах нужен <b>did</b> + начальная форма: I <b>didn't go</b>. <b>Did</b> you go?","I went to work.|Я пошёл на работу.;She saw her boss.|Она увидела начальника.;Did you buy a ticket?|Ты купил билет?"]],
["A2","🌦️","Погода и природа","Прогноз и пейзаж",
"sun|солнце;rain|дождь;snow|снег;wind|ветер;cloud|облако;storm|гроза;hot|жаркий;freezing|морозный;mountain|гора;river|река;forest|лес;flower|цветок",
"It is a sunny day.|Сегодня солнечный день.;It was windy yesterday.|Вчера был ветреный день.;It will rain tomorrow.|Завтра будет дождь.;I think it will snow tonight.|Думаю, сегодня ночью пойдёт снег.;We are going to visit the mountains.|Мы собираемся посетить горы.;What is she going to do?|Что она собирается делать?;I won't go out in the storm.|Я не пойду на улицу в грозу.;Are you going to swim in the river?|Ты собираешься плавать в реке?",
["Будущее: will и going to","<b>will</b> — решение сейчас или предсказание: It <b>will</b> rain. Отрицание: <b>won't</b>. <b>be going to</b> — заранее принятый план: We <b>are going to</b> travel. Вопрос: Are you going to…?","I will call you later.|Я позвоню тебе позже.;She is going to study English.|Она собирается учить английский.;They won't come today.|Они не придут сегодня."]],
["A2","🛍️","Покупки","Магазины и цены",
"price|цена;money|деньги;cheap|дешёвый;expensive|дорогой;discount|скидка;cash|наличные;card|карта;receipt|чек;size|размер;basket|корзина;customer|покупатель;sale|распродажа",
"How much is this jacket?|Сколько стоит эта куртка?;It is too expensive.|Это слишком дорого.;Do you have a smaller size?|У вас есть размер поменьше?;Can I pay by card?|Можно оплатить картой?;How many bags do you want?|Сколько сумок ты хочешь?;I need some money.|Мне нужны деньги.;We don't have any milk.|У нас нет молока.;There is a big sale today.|Сегодня большая распродажа.",
["How much / How many, some / any","<b>How much</b> — с неисчисляемыми (How much milk?) и в вопросе о цене. <b>How many</b> — с исчисляемыми во мн. числе (How many eggs?). <b>some</b> — в утверждениях, <b>any</b> — в вопросах и отрицаниях.","How many apples do you want?|Сколько яблок ты хочешь?;I have some bread.|У меня есть хлеб.;Is there any water?|Есть ли вода?"]],

["B2","✈️","Путешествия без шаблонов","Непредвиденные ситуации и жалобы","itinerary|маршрут;departure|отправление;accommodation|жильё;reservation|бронирование;delay|задержка;refund|возврат;overbooked|сверхзабронированный;destination|место назначения;insurance|страховка;facility|удобство;complaint|жалоба;reliable|надёжный","Our flight was delayed because of bad weather.|Наш рейс задержали из-за плохой погоды.;The hotel was not quite as described online.|Отель оказался не совсем таким, как было описано онлайн.;I'd like to make a formal complaint.|Я хотел бы подать официальную жалобу.;Could you arrange alternative accommodation?|Не могли бы вы организовать другое жильё?;We were given a full refund after the cancellation.|После отмены нам полностью вернули деньги.;The room had fewer facilities than advertised.|В номере было меньше удобств, чем обещали.;I would appreciate it if you could look into this matter.|Буду признателен, если вы сможете разобраться с этим вопросом.;Our itinerary has changed unexpectedly.|Наш маршрут неожиданно изменился.",["Условные предложения второго типа","<b>If + Past Simple, would + infinitive</b> описывает гипотетическую ситуацию: If I were you, I would complain.","If I were you, I would ask for a refund.|На твоём месте я бы попросил вернуть деньги."]],
["B2","🧠","Психология и привычки","Поведение, мотивация и решения","habit|привычка;motivation|мотивация;reward|награда;behaviour|поведение;trigger|триггер;awareness|осознанность;avoid|избегать;cope|справляться;maintain|поддерживать;pattern|модель;attitude|отношение;challenge|вызов","People often repeat behaviour that is rewarded.|Люди часто повторяют поведение, которое вознаграждается.;It is difficult to maintain a new habit at first.|Сначала трудно поддерживать новую привычку.;She found a practical way to cope with stress.|Она нашла практический способ справляться со стрессом.;The study identified a clear pattern in their behaviour.|Исследование выявило явную модель их поведения.;Awareness can help us notice unhelpful habits.|Осознанность помогает замечать бесполезные привычки.;He avoids checking his phone before breakfast.|Он избегает проверки телефона до завтрака.;Their attitude towards failure has changed.|Их отношение к неудачам изменилось.;Building a habit requires patience.|Формирование привычки требует терпения.",["Герундий после определённых глаголов","После <b>avoid, enjoy, suggest, mind, consider</b> обычно используется форма <b>-ing</b>: avoid checking, suggest taking.","She suggested taking a short break.|Она предложила сделать небольшой перерыв."]],
["B2","🎓","Образование и навыки","Учёба, оценивание и развитие","curriculum|учебная программа;assessment|оценивание;assignment|задание;academic|академический;scholarship|стипендия;deadline|срок;research|исследование;practical|практический;achievement|достижение;lecture|лекция;peer|сверстник;feedback|обратная связь","The course combines academic knowledge with practical skills.|Курс сочетает академические знания с практическими навыками.;Students are assessed through projects and exams.|Студентов оценивают по проектам и экзаменам.;I received detailed feedback on my assignment.|Я получил подробную обратную связь по заданию.;She applied for a scholarship last year.|Она подала заявку на стипендию в прошлом году.;The lecture was followed by a group discussion.|После лекции состоялось групповое обсуждение.;Research skills are useful in almost every profession.|Навыки исследования полезны почти в любой профессии.;We were given an extra week to finish the project.|Нам дали дополнительную неделю на завершение проекта.;Working with peers can improve learning outcomes.|Работа со сверстниками может улучшить результаты обучения.",["Пассивные конструкции","В формальном английском часто важен процесс: <b>is assessed, was given, has been completed</b>.","The project has been completed ahead of schedule.|Проект был завершён раньше срока."]],
["B2","💬","Абстрактные разговоры","Согласие, сомнение и нюансы","apparently|по-видимому;essentially|по сути;roughly|примерно;strictly|строго;presumably|предположительно;frankly|откровенно;eventually|в конце концов;nevertheless|тем не менее;likewise|аналогично;otherwise|иначе;indeed|действительно;overall|в целом","Apparently, the situation has improved.|По-видимому, ситуация улучшилась.;Overall, the results are quite positive.|В целом результаты довольно положительные.;Nevertheless, we should remain cautious.|Тем не менее нам стоит сохранять осторожность.;Frankly, I expected a different outcome.|Откровенно говоря, я ожидал другого результата.;The two approaches are broadly similar.|Два подхода в целом похожи.;Otherwise, we may miss an important detail.|Иначе мы можем упустить важную деталь.;The task is roughly twice as difficult as the first one.|Задание примерно вдвое сложнее первого.;Indeed, there are several reasons to reconsider it.|Действительно, есть несколько причин пересмотреть это.",["Наречия и оттенки смысла","Наречие может менять степень уверенности или отношение говорящего: <b>apparently, presumably, frankly, roughly, nevertheless</b>.","Presumably, they had already left when we arrived.|Предположительно, они уже ушли, когда мы приехали."]],
["B2","🔧","Технологии и продукты","Функции, ограничения и пользовательский опыт","feature|функция;interface|интерфейс;privacy|конфиденциальность;update|обновление;bug|ошибка;device|устройство;performance|производительность;reliable|надёжный;accessible|доступный;integrate|интегрировать;storage|хранилище;setting|настройка","The latest update introduced several useful features.|Последнее обновление добавило несколько полезных функций.;The interface is simple enough for new users.|Интерфейс достаточно прост для новых пользователей.;The app stores data locally on the device.|Приложение хранит данные локально на устройстве.;We need to improve performance on older phones.|Нам нужно улучшить производительность на старых телефонах.;Privacy should be considered from the beginning.|О конфиденциальности нужно думать с самого начала.;The service integrates with several external tools.|Сервис интегрируется с несколькими внешними инструментами.;Users reported a serious bug after the update.|Пользователи сообщили о серьёзной ошибке после обновления.;The settings can be changed at any time.|Настройки можно изменить в любое время.",["Инфинитив и gerund в значении цели","Для цели часто используется <b>to + verb</b>: We updated the app <b>to improve</b> performance.","We changed the interface to make it easier to use.|Мы изменили интерфейс, чтобы сделать его удобнее."]],
["B2","⚖️","Дебаты и компромиссы","Переговоры и противопоставление","compromise|компромисс;objection|возражение;benefit|преимущество;drawback|недостаток;negotiate|договариваться;trade-off|компромисс;alternative|альтернатива;concern|опасение;priority|приоритет;implement|внедрять;proposal|предложение;consensus|консенсус","One possible drawback is the additional cost.|Один из возможных недостатков — дополнительные расходы.;We need to find a compromise that benefits both sides.|Нам нужно найти компромисс, выгодный обеим сторонам.;I understand your concern, but there is an alternative.|Я понимаю ваше опасение, но есть альтернатива.;The proposal was rejected because of several objections.|Предложение отклонили из-за нескольких возражений.;They negotiated a trade-off between speed and quality.|Они договорились о компромиссе между скоростью и качеством.;The team reached a consensus after a long discussion.|Команда пришла к консенсусу после долгого обсуждения.;The new policy will be implemented next month.|Новая политика будет внедрена в следующем месяце.;The main benefit is that it saves time.|Главное преимущество в том, что это экономит время.",["Инверсия после отрицательных наречий","В формальном B2 можно встретить <b>Not only…, but also…</b> и <b>Rarely do we…</b> для усиления.","Not only did they reduce costs, but they also improved quality.|Они не только снизили расходы, но и улучшили качество."]],
["C1","🧪","Научное мышление","Гипотезы, данные и выводы","hypothesis|гипотеза;variable|переменная;methodology|методология;sample|выборка;correlation|корреляция;causation|причинность;reliable|надёжный;replicate|повторять;significant|значимый;findings|результаты;interpret|интерпретировать;limitation|ограничение","The findings suggest a correlation rather than direct causation.|Результаты указывают скорее на корреляцию, чем на прямую причинность.;The sample was too small to support a strong conclusion.|Выборка была слишком маленькой для уверенного вывода.;The study attempts to replicate earlier findings.|Исследование пытается воспроизвести предыдущие результаты.;The methodology has several important limitations.|У методологии есть несколько важных ограничений.;These results should be interpreted with caution.|Эти результаты следует интерпретировать осторожно.;A larger sample would make the findings more reliable.|Более крупная выборка сделала бы результаты надёжнее.;The variable was controlled throughout the experiment.|Переменная контролировалась на протяжении эксперимента.;The hypothesis was not supported by the data.|Гипотеза не подтвердилась данными.",["Сослагательные конструкции в анализе","<b>Were</b> и <b>would</b> помогают обсуждать гипотетические результаты: If the sample were larger, the conclusion would be stronger.","Had the sample been larger, the result might have been different.|Если бы выборка была больше, результат мог бы отличаться."]],
["C1","🏛️","Общество и политика","Институты, общественные процессы и последствия","institution|институт;legislation|законодательство;inequality|неравенство;incentive|стимул;regulation|регулирование;accountability|подотчётность;stakeholder|заинтересованная сторона;implementation|реализация;reform|реформа;welfare|благосостояние;participation|участие;discourse|дискурс","The reform was introduced to address growing inequality.|Реформу ввели, чтобы решить проблему растущего неравенства.;Effective implementation depends on public participation.|Эффективная реализация зависит от участия общества.;The legislation places new responsibilities on local institutions.|Законодательство возлагает новые обязанности на местные институты.;The policy created incentives for small businesses.|Мера создала стимулы для малого бизнеса.;Accountability is essential when public money is involved.|Подотчётность важна, когда речь идёт о государственных средствах.;Several stakeholders were consulted before the decision.|Перед решением проконсультировались с несколькими заинтересованными сторонами.;The debate has shaped public discourse for years.|Дебаты годами влияли на общественный дискурс.;The reform may have unintended consequences.|Реформа может иметь непредвиденные последствия.",["Номинализация в формальном английском","C1 часто превращает действия в существительные: <b>implement → implementation</b>, <b>participate → participation</b>. Это делает стиль формальнее.","The implementation of the reform was delayed.|Реализация реформы была отложена."]],
["C1","📚","Литература и стиль","Подтекст, образность и авторская позиция","narrative|повествование;subtle|тонкий;ambiguous|неоднозначный;portray|изображать;metaphor|метафора;irony|ирония;underlying|скрытый;characterize|характеризовать;symbolism|символизм;tone|тон;perspective|перспектива;interpretation|интерпретация","The narrator presents the character from a surprisingly distant perspective.|Рассказчик показывает персонажа с неожиданно отстранённой точки зрения.;The metaphor suggests a deeper conflict.|Метафора указывает на более глубокий конфликт.;The ending is deliberately ambiguous.|Концовка намеренно неоднозначна.;The author uses irony to undermine the character's confidence.|Автор использует иронию, чтобы подорвать уверенность персонажа.;The underlying message is open to interpretation.|Скрытый смысл допускает разные интерпретации.;The novel shifts between several perspectives.|Роман переключается между несколькими перспективами.;The tone becomes increasingly pessimistic.|Тон становится всё более пессимистичным.;The symbolism is subtle rather than obvious.|Символизм скорее тонкий, чем очевидный.",["Причастные обороты","C1 использует сокращённые конструкции: <b>Having finished the chapter, she…</b>; <b>Written in the first person, the novel…</b>.","Having read the novel twice, I noticed several details I had missed.|Прочитав роман дважды, я заметил несколько деталей, которые пропустил."]],
["C1","🗣️","Переговоры и дипломатия","Дипломатичный язык и разногласия","tactful|тактичный;concession|уступка;dispute|спор;counterargument|контраргумент;acknowledge|признавать;clarify|уточнять;propose|предлагать;reluctant|неохотно;feasible|осуществимый;consensus|согласие;tentative|предварительный;mutual|взаимный","I fully acknowledge the concern, although I see the situation differently.|Я полностью признаю это опасение, хотя вижу ситуацию иначе.;Perhaps we could consider a more feasible alternative.|Возможно, мы могли бы рассмотреть более осуществимую альтернативу.;The proposal is tentative and open to revision.|Предложение предварительное и может быть пересмотрено.;She was reluctant to make a public commitment.|Она не хотела публично брать на себя обязательство.;A small concession might help us reach a compromise.|Небольшая уступка могла бы помочь нам прийти к компромиссу.;Could you clarify what you mean by «acceptable»?|Не могли бы вы уточнить, что вы имеете в виду под «приемлемым»?;The two sides eventually reached a mutual agreement.|Две стороны в итоге достигли взаимного соглашения.;His counterargument was stronger than expected.|Его контраргумент оказался сильнее, чем ожидалось.",["Дипломатические конструкции","Вместо прямого <b>I disagree</b> используй <b>I see your point, however…</b>, <b>I wonder whether…</b>, <b>It might be worth considering…</b>.","It might be worth considering a different approach.|Возможно, стоит рассмотреть другой подход."]],
["C1","💻","Цифровая безопасность","Риски, данные и ответственность","encryption|шифрование;breach|утечка;credential|учётные данные;vulnerability|уязвимость;consent|согласие;retention|хранение;anonymous|анонимный;malicious|вредоносный;authenticate|аутентифицировать;exposure|раскрытие;threat|угроза;secure|защищать","The company reported a data breach last month.|Компания сообщила об утечке данных в прошлом месяце.;Users should give informed consent before their data is collected.|Пользователи должны давать информированное согласие до сбора данных.;The system uses encryption to protect sensitive information.|Система использует шифрование для защиты конфиденциальной информации.;The vulnerability was discovered during a security audit.|Уязвимость обнаружили во время аудита безопасности.;Credentials should never be shared through unsecured channels.|Учётными данными нельзя делиться через незащищённые каналы.;Data retention policies vary between services.|Политики хранения данных различаются у разных сервисов.;The attack exposed several weaknesses in the system.|Атака выявила несколько слабых мест системы.;Anonymous data can still reveal unexpected patterns.|Анонимные данные всё ещё могут выявлять неожиданные закономерности.",["Сложные пассивные конструкции","В формальном стиле встречаются <b>is believed to</b>, <b>is thought to have</b>, <b>is expected to</b>.","The vulnerability is believed to have existed for months.|Считается, что уязвимость существовала несколько месяцев."]],
["C1","📈","Экономика и рынок","Тренды, риски и прогнозы","inflation|инфляция;recession|рецессия;revenue|выручка;demand|спрос;supply|предложение;investment|инвестиция;volatile|нестабильный;forecast|прогноз;decline|снижение;growth|рост;consumer|потребитель;market|рынок","Consumer demand has declined slightly since January.|Потребительский спрос немного снизился с января.;The market remains highly volatile.|Рынок остаётся очень нестабильным.;Revenue is expected to grow despite rising costs.|Ожидается рост выручки несмотря на рост расходов.;The forecast was revised after new data emerged.|Прогноз пересмотрели после появления новых данных.;Inflation has put pressure on household budgets.|Инфляция оказала давление на бюджеты семей.;Investment could increase if interest rates fall.|Инвестиции могут вырасти, если процентные ставки снизятся.;The company reported steady growth throughout the year.|Компания сообщила о стабильном росте в течение года.;Supply constraints have affected production.|Ограничения предложения повлияли на производство.",["Инверсия и формальный прогноз","После <b>should</b> в условии возможна инверсия: <b>Should demand fall, prices may decline.</b> Это формальный стиль.","Should inflation remain high, consumers may reduce spending.|Если инфляция останется высокой, потребители могут сократить расходы."]],
["C1","🧩","Фразовые глаголы и идиомы","Естественная речь продвинутого уровня","carry out|проводить;bring up|поднимать тему;figure out|разобраться;put off|откладывать;come across|наткнуться;look into|изучить;turn down|отказать;point out|указать;set up|организовать;run into|столкнуться;take over|взять на себя;work out|получиться, решить","We need to carry out further research.|Нам нужно провести дальнейшее исследование.;She brought up an interesting point during the meeting.|Она подняла интересный вопрос на встрече.;I couldn't figure out why the system failed.|Я не смог понять, почему система не сработала.;They put off the decision until next week.|Они отложили решение до следующей недели.;I came across an article that explained the issue well.|Я наткнулся на статью, которая хорошо объясняла проблему.;The manager promised to look into the complaint.|Менеджер пообещал изучить жалобу.;We ran into several problems during implementation.|Во время реализации мы столкнулись с несколькими проблемами.;She pointed out that the figures were outdated.|Она указала, что цифры устарели.",["Позиция частицы","У фразовых глаголов местоимение обычно ставится между глаголом и частицей: <b>turn it down</b>, но существительное может стоять после: <b>turn down the offer</b>.","Could you look into it and get back to me?|Не могли бы вы разобраться с этим и сообщить мне?"]],
["C1","🎤","Публичное выступление","Структура речи и убедительность","opening|вступление;audience|аудитория;emphasize|подчёркивать;illustrate|иллюстрировать;transition|переход;persuasive|убедительный;concise|краткий;engage|вовлекать;highlight|выделять;anticipate|предугадывать;objection|возражение;takeaway|главная мысль","The opening should immediately engage the audience.|Вступление должно сразу вовлечь аудиторию.;Let me illustrate this point with a simple example.|Позвольте проиллюстрировать это простым примером.;I would like to emphasize one important distinction.|Я хотел бы подчеркнуть одно важное различие.;The transition between sections was very smooth.|Переход между разделами был очень плавным.;A persuasive speaker anticipates possible objections.|Убедительный оратор предугадывает возможные возражения.;The main takeaway is surprisingly simple.|Главная мысль удивительно проста.;Try to keep the conclusion concise.|Постарайся сделать вывод кратким.;The presentation highlighted several practical solutions.|Презентация выделила несколько практических решений.",["Риторические конструкции","C1 использует <b>What matters is…</b>, <b>What I would emphasize is…</b>, <b>It is worth noting that…</b> для структуры аргумента.","What matters most is how we respond to the problem.|Самое важное — то, как мы реагируем на проблему."]],
["C2","🪶","Точная формулировка","Оттенки значения и почти синонимы","nuance|оттенок;connotation|подтекст;implication|следствие, подтекст;distinction|различие;subtlety|тонкость;precise|точный;explicit|явный;implicit|неявный;ambiguous|двусмысленный;plausible|правдоподобный;coherent|связный;inference|вывод","The wording carries a slightly negative connotation.|Формулировка несёт слегка негативный подтекст.;There is an important distinction between the two terms.|Между двумя терминами есть важное различие.;The implication is not as obvious as it first appears.|Подтекст не так очевиден, как кажется сначала.;Her answer was deliberately ambiguous.|Её ответ был намеренно двусмысленным.;The explanation is coherent but not entirely convincing.|Объяснение связное, но не полностью убедительное.;We should be precise about what the evidence actually shows.|Нам следует точно сформулировать, что именно показывают доказательства.;The conclusion relies on an inference rather than explicit evidence.|Вывод основан на предположении, а не на явных доказательствах.;The distinction may seem subtle, but it changes the meaning.|Различие может показаться тонким, но оно меняет смысл.",["Лексическая точность","На C2 важно выбирать слово по оттенку, регистру и контексту, а не только по словарному переводу.","The distinction is subtle but crucial in this context.|Различие тонкое, но в этом контексте принципиальное."]],
["C2","⚖️","Академическая критика","Оценка аргументов и ограничений","premise|посылка;fallacy|логическая ошибка;counterexample|контрпример;robust|надёжный;overlook|упускать;qualify|делать оговорку;refute|опровергать;substantiate|подтверждать;plausibility|правдоподобие;scope|охват;shortcoming|недостаток;rigorous|строгий","The argument rests on a questionable premise.|Аргумент основан на сомнительной посылке.;The author overlooks an important counterexample.|Автор упускает важный контрпример.;The evidence is insufficient to substantiate the claim.|Доказательств недостаточно, чтобы подтвердить утверждение.;The study is rigorous, although its scope is limited.|Исследование строгое, хотя его охват ограничен.;This does not refute the original argument entirely.|Это не полностью опровергает исходный аргумент.;The conclusion should be qualified by the available evidence.|Вывод следует оговорить с учётом имеющихся доказательств.;The reasoning contains a subtle logical fallacy.|Рассуждение содержит тонкую логическую ошибку.;One shortcoming is that the sample is not representative.|Один из недостатков в том, что выборка нерепрезентативна.",["Оговорки и академический стиль","C2 требует точных ограничителей: <b>to some extent, arguably, insofar as, subject to, notwithstanding</b>.","The conclusion is defensible, albeit subject to several limitations.|Вывод можно защитить, хотя он имеет несколько ограничений."]],
["C2","🗞️","Редактура и журналистский стиль","Заголовки, тон и скрытая оценка","editorial|редакционный;wording|формулировка;framing|подача;assertion|утверждение;attribution|указание источника;allegedly|предположительно;controversial|спорный;distort|искажать;omit|опускать;emphasize|подчёркивать;headline|заголовок;coverage|освещение","The wording subtly frames the issue as a failure.|Формулировка тонко подаёт вопрос как провал.;The report attributes the claim to unnamed sources.|Отчёт приписывает утверждение неназванным источникам.;The headline omits a crucial qualification.|В заголовке опущена важная оговорка.;The story was widely covered by international media.|Историю широко освещали международные СМИ.;The article allegedly distorted the original statement.|Утверждается, что статья исказила исходное заявление.;Careful attribution is essential in sensitive reporting.|Точная атрибуция важна в чувствительных материалах.;The framing may influence how readers interpret the event.|Подача может влиять на то, как читатели воспринимают событие.;The editor asked the writer to revise the wording.|Редактор попросил автора изменить формулировку.",["Безличный и пассивный стиль","C2 часто избегает прямого обвинения: <b>It has been suggested that…</b>, <b>The claim is widely regarded as…</b>.","It has been suggested that the figures were selectively presented.|Высказывалось предположение, что цифры были представлены выборочно."]],
["C2","🧠","Философские идеи","Абстрактное рассуждение","premise|посылка;existence|существование;consciousness|сознание;determinism|детерминизм;ethics|этика;morality|мораль;agency|способность действовать;paradox|парадокс;objective|объективный;subjective|субъективный;virtue|добродетель;reasoning|рассуждение","The argument raises a broader question about human agency.|Аргумент поднимает более широкий вопрос о человеческой способности действовать.;The distinction between subjective experience and objective facts is complex.|Различие между субъективным опытом и объективными фактами сложно.;The paradox cannot be resolved by a simple answer.|Парадокс нельзя решить простым ответом.;Whether morality is objective remains contested.|Остаётся спорным, является ли мораль объективной.;The reasoning assumes that freedom requires conscious choice.|Рассуждение предполагает, что свобода требует осознанного выбора.;The theory has implications far beyond philosophy.|Теория имеет последствия далеко за пределами философии.;This interpretation rests on a particular conception of existence.|Эта интерпретация основана на определённом понимании существования.;The author distinguishes virtue from mere social approval.|Автор отличает добродетель от простого общественного одобрения.",["Сослагательное прошедшее и условные конструкции","C2 уверенно использует смешанные условия и конструкции вроде <b>Had it not been for…</b>.","Had it not been for that assumption, the argument would be much weaker.|Если бы не это предположение, аргумент был бы значительно слабее."]],
["C2","🔬","Наука и неопределённость","Вероятность, пределы знания и интерпретация","uncertainty|неопределённость;tentative|предварительный;estimate|оценка;parameter|параметр;threshold|порог;deviation|отклонение;robust|устойчивый;replicate|воспроизводить;validity|валидность;confound|искажать;precision|точность;reproducibility|воспроизводимость","The estimate should be treated as tentative rather than definitive.|Оценку следует считать предварительной, а не окончательной.;The result falls within the expected range of uncertainty.|Результат находится в ожидаемом диапазоне неопределённости.;A small deviation does not necessarily invalidate the model.|Небольшое отклонение не обязательно делает модель неверной.;The study's validity depends on how the parameters were selected.|Валидность исследования зависит от выбора параметров.;The experiment could not be replicated under identical conditions.|Эксперимент не удалось воспроизвести в идентичных условиях.;Several factors may have confounded the results.|Несколько факторов могли исказить результаты.;The threshold was lower than initially estimated.|Порог оказался ниже первоначальной оценки.;Precision should not be confused with accuracy.|Точность измерения не следует путать с правильностью.",["Условные конструкции для неопределённости","Используй <b>might have, could have, would have, may well have</b> для аккуратного описания прошлых возможностей.","The discrepancy may well have resulted from measurement error.|Расхождение вполне могло возникнуть из-за ошибки измерения."]],
["C2","🧭","Сложные решения","Риски, последствия и компромиссы","trade-off|компромисс;unintended|непреднамеренный;repercussion|последствие;viable|жизнеспособный;constraint|ограничение;contingency|запасной план;mitigate|смягчать;allocate|распределять;prioritize|расставлять приоритеты;feasibility|осуществимость;long-term|долгосрочный;short-term|краткосрочный","Any decision should account for its long-term repercussions.|Любое решение должно учитывать долгосрочные последствия.;The proposal is viable, provided that funding is secured.|Предложение осуществимо при условии обеспечения финансирования.;We need to mitigate the risks before implementation.|Нам нужно снизить риски до внедрения.;Limited resources force us to prioritize certain goals.|Ограниченные ресурсы заставляют нас расставлять приоритеты.;The feasibility study identified several constraints.|Исследование осуществимости выявило несколько ограничений.;A contingency plan would reduce the potential impact of delays.|Запасной план снизил бы возможное влияние задержек.;The trade-off between speed and accuracy is unavoidable.|Компромисс между скоростью и точностью неизбежен.;Funds should be allocated according to clearly defined priorities.|Средства следует распределять согласно чётким приоритетам.",["Условные обороты и инверсия","Продвинутый условный стиль: <b>Provided that</b>, <b>assuming that</b>, <b>were we to</b>, <b>had we known</b>.","Were we to ignore the constraint, the project would become unviable.|Если бы мы проигнорировали ограничение, проект стал бы нежизнеспособным."]],

const norm=s=>String(s).toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=0;j<=b.length;j++)m[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
const sim=(a,b)=>{a=norm(a);b=norm(b);const l=Math.max(a.length,b.length);return l?1-lev(a,b)/l:1};
const CLASSES=[["am","is","are"],["do","does","did"],["a","an","the"],["in","on","at"],["was","were"],["have","has"],["much","many"],["some","any"],["will","would","can"],["don't","doesn't","didn't"],["my","your","his","her"],["this","that","these","those"],["can","should","will"]];

 for(const x of[...same.slice(0,2),...oth]){const v=dir==="e2r"?ruOf(x):x.en;if(v!==a&&!out.includes(v))out.push(v);if(out.length>=n)break}return out}
const mcqW=(w,dir)=>dir==="e2r"?{t:"mcq",q:"Как переводится?",big:w.en,say:w.en,opts:shuffle([ruOf(w),...distract(w,"e2r")]),ans:ruOf(w),w:w.id}:{t:"mcq",q:"Выбери перевод на английский",big:ruOf(w),opts:shuffle([w.en,...distract(w,"r2e")]),ans:w.en,w:w.id};
const listenW=w=>({t:"listen",q:"Что ты слышишь?",say:w.en,opts:shuffle([w.en,...distract(w,"r2e")]),ans:w.en,w:w.id});
const listenRuW=w=>({t:"listenru",q:"Послушай английскую фразу и напиши перевод по-русски",say:w.en,ans:ruOf(w),w:w.id});

const speakW=w=>({t:"speak",q:"Произнеси вслух",big:w.en,sub:ruOf(w),say:w.en,ans:w.en,w:w.id});

function mcqS(s){const U=UNITS[s.u];const o=shuffle(U.sents.filter(x=>x.id!==s.id)).slice(0,3).map(x=>x.ru);return{t:"mcq",q:"Как переводится?",big:s.en,small:1,say:s.en,opts:shuffle([s.ru,...o]),ans:s.ru,s:s.id}}
function buildS(s,listen){const U=UNITS[s.u],w=s.en.split(" ").map(clean),set=new Set(w.map(x=>x.toLowerCase()));
 const pool=shuffle(U.sents.filter(x=>x.id!==s.id).flatMap(x=>x.en.split(" ").map(clean))).filter(x=>!set.has(x.toLowerCase())&&x.length>1);
 const ex=[...new Set(pool)].slice(0,2);
 return{t:"build",q:listen?"Напиши то, что слышишь":"Переведи предложение",big:listen?null:s.ru,say:listen?s.en:null,ans:s.en,tokens:shuffle([...w,...ex]),s:s.id,small:1}}
function blankS(s){const tk=s.en.split(" ");let idx=-1;
 const cand=tk.map((x,i)=>({x:clean(x),i})).filter(o=>o.i>0&&(GRAM.has(o.x.toLowerCase())));
 if(cand.length)idx=pick(cand).i;else{const c2=tk.map((x,i)=>({x:clean(x),i})).filter(o=>o.i>0&&!/^[A-Z]/.test(o.x)&&o.x.length>1);idx=c2.length?pick(c2).i:tk.length-1}
 const ans=clean(tk[idx]),al=ans.toLowerCase();const cl=CLASSES.find(c=>c.includes(al));let opts=cl?cl.filter(x=>x!==al).slice(0,3):[];
 const U=UNITS[s.u],pool=shuffle([...new Set(U.sents.flatMap(x=>x.en.split(" ").map(z=>clean(z).toLowerCase())))]).filter(x=>x!==al&&x.length>1&&!opts.includes(x)&&!/^[A-Z]/.test(x));
 while(opts.length<3&&pool.length)opts.push(pool.pop());
 const txt=tk.map((x,i)=>i===idx?"_____"+(/[.,!?;:]+$/.test(x)?x.match(/[.,!?;:]+$/)[0]:""):x).join(" ");
 return{t:"blank",q:"Вставь пропущенное слово",big:txt,small:1,sub:s.ru,opts:shuffle([al,...opts]),ans:al,full:s.en,s:s.id}}
const typeS=s=>({t:"type",q:"Переведи на английский",big:s.ru,small:1,ans:s.en,s:s.id,say:s.en});
const speakS=s=>({t:"speak",q:"Произнеси вслух",big:s.en,small:1,sub:s.ru,say:s.en,ans:s.en,s:s.id});

function buildLesson(u,k){
 const U=UNITS[u],W=U.words,Z=U.sents;let ex=[];
 if(k==="w1"||k==="w2"){const ws=k==="w1"?W.slice(0,6):W.slice(6,12);
  ex.push({t:"intro",title:"Новые слова",items:ws});
  shuffle(ws).forEach(w=>ex.push(mcqW(w,"e2r")));ex.push(matchW(shuffle(ws).slice(0,5)));
  shuffle(ws).forEach(w=>ex.push(mcqW(w,"r2e")));shuffle(ws).forEach(w=>ex.push(listenW(w)));
  shuffle(ws).forEach(w=>ex.push(listenRuW(w)));shuffle(ws).forEach(w=>ex.push(typeW(w)));ex.push(speakW(pick(ws)));
  shuffle(ws).slice(0,3).forEach(w=>ex.push(speakW(w)));ex.push(matchW(shuffle(ws).slice(0,6)))}
 else if(k==="ph"){const ss=Z.slice(0,4);
  ex.push({t:"intro",title:"Новые фразы",items:ss});
  ss.forEach(s=>ex.push(mcqS(s)));ss.forEach(s=>ex.push(buildS(s)));shuffle(ss).forEach(s=>ex.push(buildS(s,1)));
  shuffle(ss).forEach(s=>ex.push(blankS(s)));shuffle(ss).forEach(s=>ex.push(typeS(s)));shuffle(ss).forEach(s=>ex.push(listenRuS(s)));shuffle(ss).forEach(s=>ex.push(speakS(s)))}
 else if(k==="gr"){const ss=Z.slice(4,8);
  ex.push({t:"note",g:U.g});
  ss.forEach(s=>{ex.push(blankS(s));ex.push(buildS(s));ex.push(typeS(s));ex.push(listenRuS(s));});shuffle(ss).forEach(s=>ex.push(mcqS(s)));shuffle(ss).slice(0,3).forEach(s=>ex.push(speakS(s)))}
 else{const pool=[];
  shuffle(W).slice(0,6).forEach(w=>pool.push(listenW(w)));shuffle(W).slice(0,4).forEach(w=>pool.push(listenRuW(w)));shuffle(W).slice(0,4).forEach(w=>pool.push(mcqW(w,"r2e")));
  shuffle(Z).slice(0,4).forEach(s=>pool.push(buildS(s,1)));shuffle(Z).slice(0,4).forEach(s=>pool.push(buildS(s)));
  shuffle(Z).slice(0,4).forEach(s=>pool.push(typeS(s)));shuffle(Z).slice(0,4).forEach(s=>pool.push(blankS(s)));
  ex=shuffle(pool);shuffle(Z).slice(0,3).forEach(s=>ex.push(listenRuS(s)));shuffle(Z).slice(0,3).forEach(s=>ex.push(speakS(s)));ex.push(speakW(pick(W)));ex.push(matchW(shuffle(W).slice(0,6)))}
 return ex}
function buildReview(){const ids=dueIds().sort((a,b)=>D.words[a][1]-D.words[b][1]).slice(0,10);const ex=[];

/* --- интерфейс чата --- */
function vChat(){
 if(!CH.on)return`<div class="view"><div class="ch-top"><button class="ib" data-act="home" aria-label="Назад">←</button><div class="ch-t"><b>Разговор с Эммой</b><small>ИИ-собеседница</small></div></div><div class="scroll" style="padding-top:18px">
 <div class="level-result"><b>${D.lvl}</b><span>Собеседник автоматически подстроен под твой текущий уровень. Его нельзя переключить вручную — он меняется вместе с обучением.</span></div>
 <div class="sec" style="margin-top:20px"><h2>Тема разговора</h2></div>
 <div class="sc-grid">${Object.entries(SCN).map(([k,s])=>`<button class="sc ${CH.scn===k?"on":""}" data-act="chScn" data-v="${k}"><i>${s.e}</i><b>${s.t}</b><small>${s.d}</small></button>`).join("")}</div>
 <button class="btn" data-act="chGo">Начать разговор</button></div></div>`;
 return`<div class="view"><div class="ch-top"><button class="ib" data-act="chSetup" aria-label="Назад">←</button><div class="av" style="--s:42px"><span>E</span></div><div class="ch-t"><b>Emma</b><small>${SCN[CH.scn].t}, ${CH.level}</small></div><button class="ib ${CH.hints?"on":""}" id="hbtn" data-act="hintTog" aria-label="Подсказки">💡</button></div>
 <div class="scroll msgs" id="msgs"></div><div class="hints" id="hints"></div>
 <div class="cin-bar"><input class="cin" id="cin" placeholder="Напиши по-английски…" autocomplete="off" autocapitalize="sentences" enterkeyhint="send">${SR?`<button class="ib" id="cmic" data-act="cMic" aria-label="Голос">🎙️</button>`:""}<button class="send" data-act="send" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>`}
function msgHtml(m){
 if(m.r==="sys")return`<div class="sysn">${esc(m.t)}</div>`;
 if(m.r==="end")return`<div class="endc"><b>Диалог завершён. +${m.xp} XP</b><div class="two" style="display:flex;gap:10px"><button class="btn sm soft" data-act="chSetup" style="flex:1">Другая тема</button><button class="btn sm" data-act="chGo" style="flex:1">Ещё раз</button></div></div>`;
 if(m.r==="me")return`<div class="m me"><div class="b">${esc(m.t)}</div>${m.fix?`<div class="fix"><b>Лучше: ${esc(m.fix.fixed)}</b><span>${esc(m.fix.note||"")}</span></div>`:""}</div>`;
 const w=m.t.split(/(\s+)/).map(t=>/[A-Za-z]/.test(t)?`<span class="w" data-act="word" data-w="${esc(t)}">${esc(t)}</span>`:esc(t)).join("");
 return`<div class="m ai"><div class="b">${w}</div><button class="spk" data-act="say" data-t="${esc(m.t)}" aria-label="Озвучить">🔊</button></div>`}
const scrollEnd=()=>{const e=$("#msgs");if(e)requestAnimationFrame(()=>e.scrollTo({top:e.scrollHeight,behavior:"smooth"}))};
function chatRebuild(){const e=$("#msgs");e.innerHTML=CH.msgs.map(msgHtml).join("");renderHints();e.scrollTop=e.scrollHeight;if(CH.over){const i=$("#cin");if(i){i.disabled=true;i.placeholder="Диалог завершён"}}}
function addMsg(m){CH.msgs.push(m);const e=$("#msgs");if(!e)return;e.insertAdjacentHTML("beforeend",msgHtml(m));scrollEnd()}
function renderHints(){const h=$("#hints");if(!h)return;if(!CH.hints||CH.over){h.innerHTML="";return}const k=H[CH.tag]?CH.tag:H[ALIAS[CH.tag]]?ALIAS[CH.tag]:"free";
 h.innerHTML=H[k].map(x=>{const[a,b]=x.split("|");return`<button class="hint" data-act="hint" data-t="${esc(a)}"><b>${esc(a)}</b><small>${esc(b)}</small></button>`}).join("")}
function typing(on){const e=$("#msgs");if(!e)return;const o=$("#typ");if(o)o.remove();if(on){e.insertAdjacentHTML("beforeend",`<div class="m ai typ" id="typ"><div class="b"><i></i><i></i><i></i></div></div>`);scrollEnd()}}
function emmaSay(text,tag){return new Promise(res=>{typing(true);setTimeout(()=>{typing(false);addMsg({r:"ai",t:text});LG.lastAssistant=text;CH.lastQ=text;if(tag)CH.tag=tag;renderHints();if(D.auto)speak(text);res()},Math.min(1700,550+text.length*13))})}
async function chatStart(){CH.level=D.lvl;Object.assign(CH,{on:true,msgs:[],step:0,mem:{name:null},asked:new Set(),tag:"free",topic:null,over:false,n:0,xp:0,lastQ:"",busy:false});Object.assign(LG,{turns:[],facts:{},lastIntent:"",lastTopic:"",lastUser:"",lastAssistant:"",confidence:0,misunderstandings:0,asked:new Set(),used:new Set()});CH.hints=!(["C1","C2"].includes(CH.level));S.view="chat";render();
 const sc=SCN[CH.scn];addMsg({r:"sys",t:sc.intro});CH.busy=true;
 if(sc.steps)await emmaSay(stepText(0),sc.steps[0][1]);else await emmaSay(L3("Hi! I'm Emma. How are you today?","Hi there! I'm Emma. How's your day going?","Hello! I'm Emma, great to see you. How has your day been so far?"),"how");CH.busy=false}
async function chatSend(){if(CH.busy||CH.over)return;const i=$("#cin"),raw=i.value.trim();if(!raw)return;i.value="";CH.busy=true;
 const r=geniusTurn(raw);addMsg({r:"me",t:raw,fix:r.fix});CH.n++;D.chats++;LG.lastUser=raw;LG.lastIntent=lgIntent(raw);LG.turns.push({user:raw,assistant:r.text,topic:lgTopic(raw)||LG.lastTopic,level:CH.level,score:lgConversationScore(raw)});if(LG.turns.length>30)LG.turns.shift();
 if(CH.xp<30){CH.xp+=2;addXP(2)}touchStreak();save();
 await emmaSay(r.text,r.tag);
 if(r.over&&CH.n>=3){const b=10;addXP(b);save();addMsg({r:"end",xp:b+CH.xp});const x=$("#cin");x.disabled=true;x.placeholder="Диалог завершён";renderHints()}
 else if(r.over){addMsg({r:"end",xp:CH.xp});CH.over=true;renderHints()}
 CH.busy=false;checkAch().forEach(a=>toast(a.e+" Достижение: "+a.t))}
A.chat=()=>{CH.level=D.lvl;S.view="chat";render()};
A.chSetup=()=>{CH.on=false;S.view="chat";render()};
A.chLvl=()=>{};
A.chScn=el=>{CH.scn=el.dataset.v;render(true)};
A.chGo=()=>chatStart();
A.send=()=>chatSend();
A.hint=el=>{const i=$("#cin");i.value=el.dataset.t;i.focus()};
A.hintTog=()=>{CH.hints=!CH.hints;$("#hbtn").classList.toggle("on",CH.hints);renderHints()};
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="cin"){e.preventDefault();chatSend()}});
let crec=null;
A.cMic=el=>{if(crec){try{crec.stop()}catch(x){}return}try{crec=new SR();crec.lang="en-US";crec.interimResults=false;el.classList.add("on");
 crec.onresult=ev=>{$("#cin").value=ev.results[0][0].transcript;$("#cin").focus()};crec.onend=()=>{el.classList.remove("on");crec=null};crec.onerror=()=>{el.classList.remove("on");crec=null;toast("Не удалось распознать речь")};crec.start()}catch(x){crec=null;toast("Микрофон недоступен")}};
function rmTip(){const t=$("#tip");if(t)t.remove()}
A.word=el=>{rmTip();const w=el.dataset.w.replace(/[^A-Za-z']/g,"");if(!w)return;const tr=lookup(w);speak(w,.8);const r=el.getBoundingClientRect(),t=document.createElement("div");t.className="tip";t.id="tip";
 t.innerHTML=`<span><b>${esc(w)}</b> — ${tr?esc(tr):"нет в словаре"}</span>`;document.body.appendChild(t);
 const tw=t.offsetWidth;t.style.left=Math.max(8,Math.min(innerWidth-tw-8,r.left))+"px";t.style.top=(r.top>70?r.top-t.offsetHeight-8:r.bottom+8)+"px";setTimeout(rmTip,3200)};

/* --- общий обработчик кликов --- */
document.addEventListener("click",e=>{if(!e.target.closest("#tip")&&!e.target.closest('[data-act="word"]'))rmTip();const el=e.target.closest("[data-act]");if(!el)return;const f=A[el.dataset.act];if(f){if(!/^(opt|tok|untok|mL|mR|set|tog)$/.test(el.dataset.act))haptic();f(el,e)}});

/* ================= ЗАПУСК ================= */
async function boot(){
 tgInit();applyTheme();
 const u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;
 S.tg=u?{id:u.id,first:u.first_name||"",last:u.last_name||"",username:u.username||("id"+u.id),photo:u.photo_url||""}:{id:0,first:"Гость",last:"",username:"",photo:"",demo:true};
 app.innerHTML='<div class="view auth"><div class="tg-safe"></div><div class="auth-in"><div class="brand">Lingua</div><small>Загрузка…</small></div></div>';
 const accs=getAccs();
 if(cloud.ok){const c=await cloudPull();if(c.acc&&c.acc.u){S.cloudAcc=c.acc;S.cloudData=c.data;if(!accs[c.acc.u]){accs[c.acc.u]=c.acc;setAccs(accs)}}}
 const sess=LS.get("lg_sess");let target=S.tg.demo?sess:String(S.tg.username).toLowerCase();
 let acc=target&&accs[target];
 if(!acc&&S.cloudAcc)acc=S.cloudAcc;
 if(acc&&!S.tg.demo&&acc.tgId&&acc.tgId!==S.tg.id)acc=null;
 if(acc){S.loginAcc=acc;
  if(sess===acc.u){S.acc=acc;const local=jget("lg_d_"+acc.u,null),cl=S.cloudData;D=Object.assign(defD(),(cl&&(!local||(cl.upd||0)>(local.upd||0)))?cl:(local||{}));save();enterApp(false)}
  else{S.view="login";render()}}
 else{S.view="welcome";render()}}
boot();
</script>
</body>
